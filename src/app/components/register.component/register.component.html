<div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
  <div class="card shadow p-4" style="width: 100%; max-width: 500px;">
    <h3 class="text-center mb-4">Registro de Usuario</h3>
    
    @if (errorMessage) {
      <div class="alert alert-danger">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onRegister()">
      <div class="mb-3">
        <label class="form-label">Nombre Completo</label>
        <input type="text" class="form-control" name="name" [(ngModel)]="user.name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control" name="email" [(ngModel)]="user.email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="user.password" required>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Fecha de Nacimiento</label>
          <input type="date" class="form-control" name="birthDate" [(ngModel)]="user.birthDate" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Género</label>
          <select class="form-select" name="gender" [(ngModel)]="user.gender">
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="O">Otro</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Nivel de Juego</label>
        <select class="form-select" name="level" [(ngModel)]="user.level">
          <option value="BASIC">Básico</option>
          <option value="MEDIUM">Medio</option>
          <option value="HIGH">Alto</option>
        </select>
      </div>

      <button type="submit" class="btn btn-success w-100">Registrarse</button>
    </form>
    
    <div class="text-center mt-3">
      <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia Sesión</a></p>
    </div>
  </div>
</div>
